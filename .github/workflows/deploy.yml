name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy no servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          protocol: tcp4
          timeout: 120s
          debug: true
          script: |
            set -e

            cd /home/u178981784/domains/digify.com.br/digify

            echo "Commit antes:"
            git rev-parse --short HEAD

            git fetch origin main
            git reset --hard origin/main

            echo "Commit depois:"
            git rev-parse --short HEAD