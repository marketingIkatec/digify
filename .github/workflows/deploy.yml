name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy no servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          protocol: tcp4
          timeout: 120s
          debug: true
          script: |
            set -e
            cd /home/u178981784/domains/digify.com.br/digify
            PROJECT_DIR="/home/u178981784/domains/digify.com.br/digify"
            BACKUP_DIR="/home/u178981784/domains/digify.com.br/backup/digify"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            BACKUP_FILE="${BACKUP_DIR}/digify_backup_${TIMESTAMP}.tar.gz"

            echo "========================================"
            echo "Iniciando deploy do Digify"
            echo "========================================"

            # 1. Criar diretório de backups
            mkdir -p "$BACKUP_DIR"

            # 2. Entrar no projeto
            cd "$PROJECT_DIR"

            echo "Commit atual:"
            git rev-parse --short HEAD

            # 3. Criar backup antes de atualizar o código
            echo "Criando backup antes do deploy..."

            tar -czf "$BACKUP_FILE" \
                --exclude='./vendor' \
                --exclude='./node_modules' \
                --exclude='./.git' \
                --exclude='./storage' \
                -C "$PROJECT_DIR" .

            echo "Backup criado: $BACKUP_FILE"

            # 4. Atualizar código
            echo "Atualizando código..."

            git fetch origin main
            git reset --hard origin/main

            echo "Commit depois:"
            git rev-parse --short HEAD

            # 5. Limpar caches
            echo "Limpando caches do Laravel..."

            php artisan optimize:clear

            # 6. Executar migrations
            echo "Executando migrations..."

            php artisan migrate --force

            # 7. Gerar caches
            echo "Gerando caches do Laravel..."

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # 8. Manter somente os últimos 7 backups
            echo "Limpando backups antigos..."

            ls -1t "$BACKUP_DIR"/digify_backup_*.tar.gz 2>/dev/null \
                | tail -n +8 \
                | xargs -r rm --

            echo "========================================"
            echo "Deploy concluído!"
            echo "Backup: $BACKUP_FILE"
            echo "========================================"
